name: Update NASA hotspots hourly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-hotspots.yml'
      - 'scripts/update_hotspots.py'
      - 'scripts/hotspot-boundaries.json'
      - 'vercel.json'

permissions:
  contents: write

concurrency:
  group: nasa-hotspot-data
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read previous successful retrieval
        run: |
          set -euo pipefail
          remote_branch=$(git ls-remote --heads origin hotspot-data)
          if [ -n "$remote_branch" ]; then
            git fetch origin hotspot-data
            git show FETCH_HEAD:data/hotspots.json > previous-hotspots.json
            git rev-parse FETCH_HEAD > previous-parent.txt
          fi
      - name: Download and validate NASA export
        run: python3 scripts/update_hotspots.py --previous previous-hotspots.json
      - name: Publish data on its own branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w data/hotspots.json)
          data_tree=$(printf '100644 blob %s\thotspots.json\n' "$blob" | git mktree)
          config_blob=$(git hash-object -w vercel.json)
          root_tree=$(printf '040000 tree %s\tdata\n100644 blob %s\tvercel.json\n' "$data_tree" "$config_blob" | git mktree)
          if [ -f previous-parent.txt ]; then
            commit=$(printf 'Refresh NASA FIRMS detections\n' | git commit-tree "$root_tree" -p "$(cat previous-parent.txt)")
          else
            commit=$(printf 'Initialize NASA FIRMS detections\n' | git commit-tree "$root_tree")
          fi
          git push origin "$commit:refs/heads/hotspot-data"
